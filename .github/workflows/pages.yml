name: Desplegar frontend en GitHub Pages

# Solo el frontend. La API vive en PythonAnywhere porque el profesor exige un
# backend en Python y el plan gratuito no permite desplegarlo aquí: GitHub
# Pages sirve archivos estáticos y nada más.
#
# Se despliega el contenido de static/ en la raíz del sitio, no el repositorio
# entero, para que app.js y config.js queden en /app.js y /config.js, que es la
# ruta que espera index.html.

on:
  push:
    branches: ["main"]
    paths:
      - "static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un único grupo de concurrencia: GitHub Pages admite una publicación a la vez,
# y sin esto la segunda cancela a la primera con un error confuso. No se cancela
# la que ya está en curso, porque dejar el sitio a medio publicar es peor que
# esperar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement: true deja que la propia action cree el sitio Pages si no
      # existe todavia. Sin esto, el primer run falla con "Get Pages site
      # failed" en cuanto alguien clona el repo y no ha activado Pages a mano
      # antes, que es justo lo que pasa la primera vez en cualquier repo nuevo.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # GitHub Pages responde con Cache-Control: max-age=600, y el navegador
      # guarda config.js, app.js y styles.css diez minutos. Sin este paso, quien
      # abre la web justo despues de un despliegue puede estar viendo la version
      # anterior. No es hipotesis: abrio la pagina con el config.js viejo, el que
      # tenia apiBase vacio, y mostro "modo local - sin backend" con el backend
      # funcionando y el CORS ya resuelto.
      #
      # El paso delega en deploy/versionar_assets.py, y no en un sed suelto, por
      # dos motivos. Uno es que el script se puede ejecutar en local antes de
      # subirlo. El otro es que un sed con delimitador "|" falla en cuanto el
      # patron necesita "|" para la alternancia, y ese fallo salio en el primer
      # despliegue de este paso: "unknown option to `s'".
      #
      # Ojo con la consecuencia: el script modifica el index.html de la copia de
      # trabajo, no el del repositorio. Lo que se publica lleva ?v=<sha> y lo que
      # hay en static/index.html, no. Es a proposito, pero conviene saberlo antes
      # de extrañar que el HTML servido no coincide con el del repo.
      - name: Marcar los recursos con la versión
        run: python3 deploy/versionar_assets.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: static

      - id: publicar
        uses: actions/deploy-pages@v4
