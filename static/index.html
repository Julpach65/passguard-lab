<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PassGuard · Probador y generador de contraseñas</title>
    <meta name="description"
        content="Probador y generador de contraseñas. Veredicto calculado en el servidor. Seguridad de la Información, UPSIN." />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Cpath d='M11 16v-4a5 5 0 0 1 10 0v4' fill='none' stroke='%2360a5fa' stroke-width='2.5'/%3E%3Crect x='8' y='16' width='16' height='11' rx='2' fill='none' stroke='%2360a5fa' stroke-width='2.5'/%3E%3C/svg%3E" />
</head>

<body>
    <a class="skip-link" href="#panel-analizador">Saltar al probador</a>

    <header class="topbar">
        <h1>PassGuard</h1>
        <p class="conn" id="status-badge" data-state="pending">Conectando&hellip;</p>
    </header>

    <main class="grid">
        <section class="card" id="panel-analizador" aria-labelledby="h-probador">
            <h2 id="h-probador">Probador</h2>

            <label class="field-label" for="pw-input">Escribe una contraseña</label>
            <div class="input-wrap">
                <input id="pw-input" type="password" placeholder="Escribe aquí tu contraseña" autocomplete="off"
                    autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="verdict-live" />
                <button type="button" class="ghost" id="btn-toggle-pw" aria-pressed="false"
                    aria-label="Mostrar contraseña" title="Mostrar contraseña">Ver</button>
                <button type="button" class="ghost" id="btn-clear-pw" title="Borrar contraseña">Limpiar</button>
            </div>

            <p class="verdict" id="verdict-live" role="status" aria-live="polite">
                La contraseña aún no se ha evaluado.
            </p>
            <p class="metrics" id="strength-score">&mdash;</p>

            <ul class="rules" id="requirements-list"></ul>

            <p class="notice" id="notice-fallback" hidden>
                <span id="fallback-detail"></span>
                <button type="button" class="link" id="btn-retry">Reintentar</button>
            </p>
        </section>

        <section class="card" aria-labelledby="h-generador">
            <h2 id="h-generador">Generador</h2>

            <form id="gen-form">
                <label class="field-label" for="gen-length">Longitud: <output id="gen-length-value">20</output></label>
                <input id="gen-length" type="range" min="12" max="64" step="1" value="20" />
                <button type="submit" class="primary" id="gen-submit">Generar contraseña</button>
            </form>

            <div class="output-wrap">
                <input id="gen-output" type="text" readonly placeholder="Aquí aparecerá la contraseña"
                    aria-label="Contraseña generada" />
                <button type="button" class="ghost" id="btn-gen-copy">Copiar</button>
                <button type="button" class="ghost" id="btn-gen-analyze">Probar</button>
            </div>

            <p class="verdict" id="gen-status" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
